name: site-speed

# Manual, read-only: Lighthouse (Google's page-speed test, the engine behind PageSpeed Insights)
# loads 4 public pages once each in a phone-sized Chrome on the runner. Lighthouse names itself in
# its User-Agent. The summary goes to the PRIVATE data repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: VRH7733/rtech-price-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: pd

      - name: Run Lighthouse
        env:
          WC_URL: ${{ secrets.WC_URL }}
        run: |
          mkdir -p lh
          base="${WC_URL%/}"
          i=0
          for path in / /shop/ /product-category/wires-cables/ /brand/havells/; do
            i=$((i+1))
            npx -y lighthouse@12.8.2 "$base$path" --quiet --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,seo,best-practices,accessibility --output=json --output-path="lh/$i.json" || true
            sleep 5
          done
          python3 tools/lighthouse_summary.py lh pd/seo/speed.md

      - name: Save the report to the private data repo
        if: always()
        run: |
          cd pd
          git config user.name "price-sync-bot"
          git config user.email "price-sync-bot@users.noreply.github.com"
          git add seo/speed.md 2>/dev/null || exit 0
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "site speed $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
