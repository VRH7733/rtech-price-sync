name: daily-prices

# Two repos: this PUBLIC repo has the code; the PRIVATE repo VRH7733/rtech-price-data has the
# catalogue (catalogue/rows/*.csv) and the run data (data/). The private repo is checked out with
# the DATA_REPO_TOKEN secret; nothing private is committed here, and the public log shows counts.
#
# Daily run, owner's go-live approval (15 Oct 2026, in the project thread): every morning it
# PUBLISHES the cheapest price of the three sites for catalogue rows with publish=yes and a shop
# product id. Each product is checked once every 3 days (a third each morning, config
# fetch.check_every_days), 6 s apart per site, at most 1,500 requests per site per run. It starts
# at 01:00 IST and is done well before the shop's 07:30 IST cache purge. GitHub may start scheduled runs late or drop them (the 15 Oct 23:30 UTC
# run never fired), so a backup schedule at 03:00 IST runs only if no publish run happened yet
# that IST day. A manual run is a dry run unless mode=publish is given.
on:
  schedule:
    # GitHub starts scheduled runs late or not at all (16-17 Oct: 2.5 h late / never), so several
    # tries; each is skipped once today's (IST) run has published.
    - cron: "40 18 * * *"   # 00:10 IST
    - cron: "30 19 * * *"   # 01:00 IST
    - cron: "30 20 * * *"   # 02:00 IST
    - cron: "30 21 * * *"   # 03:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run or publish (empty = repo variable PUBLISH_MODE, else dry-run)"
        required: false
        default: ""
      include_pending:
        description: "dry run only: also evaluate publish=pending_review rows (pilot)"
        type: boolean
        default: false
      only_new:
        description: "only products never priced yet (e.g. created after the morning run started)"
        type: boolean
        default: false
      all_products:
        description: "check every product, not just today's third (sends 3x the requests; avoid)"
        type: boolean
        default: false
      skus:
        description: "only these SKUs, space-separated (a targeted re-check; empty = normal)"
        required: false
        default: ""
      kept_only:
        description: "only products no site is asked about: re-judge their kept prices (no requests)"
        type: boolean
        default: false
      brand:
        description: "limit to one brand (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

# Never let two runs overlap (they would hit the marketplaces twice as fast).
concurrency:
  # shared with discover.yml: one client per site at a time. A kept_only run asks no site, so it
  # does not queue there (GitHub keeps only ONE pending run per group and would cancel the other).
  group: ${{ github.event.inputs.kept_only == 'true' && 'kept-only' || 'marketplace-fetch' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # also one shop writer at a time (create-drafts, enrich-products) so saves never overwrite
    concurrency:
      group: shop-writes
      cancel-in-progress: false
    # GitHub-hosted jobs are capped at 6 h (docs.github.com/en/actions/reference/limits).
    timeout-minutes: 355
    env:
      PYTHONPATH: src
      RTECH_CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      MODE: ${{ github.event_name == 'schedule' && 'publish' || github.event.inputs.mode || 'dry-run' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: VRH7733/rtech-price-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: pd
          fetch-depth: 50  # the guard below reads today's commits

      - name: Skip the backup schedule if today's run already published
        id: guard
        run: |
          cd pd
          today=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && \
             git log --since="${today}T00:00:00+05:30" --format=%s | grep -q "^price sync ${today} \[publish\]"; then
            echo "A publish run already happened on $today (IST); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Unit tests (fast guard - a broken rule must not reach the shop)
        if: steps.guard.outputs.skip != 'true'
        run: python -m pytest -q

      - name: Run price sync
        id: sync
        if: steps.guard.outputs.skip != 'true'
        # shop credentials are only visible to this step (not to pip or pytest)
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          INCLUDE_PENDING: ${{ github.event.inputs.include_pending }}
          BRAND: ${{ github.event.inputs.brand }}
          ONLY_NEW: ${{ github.event.inputs.only_new }}
          ALL_PRODUCTS: ${{ github.event.inputs.all_products }}
          KEPT_ONLY: ${{ github.event.inputs.kept_only }}
          SKUS: ${{ github.event.inputs.skus }}
        run: |
          set +e
          ARGS="--catalogue pd/catalogue/rows --data pd/data"
          if [ "$MODE" = "publish" ]; then ARGS="$ARGS --publish"; fi
          if [ "$INCLUDE_PENDING" = "true" ]; then ARGS="$ARGS --include-pending"; fi
          if [ -n "$BRAND" ]; then ARGS="$ARGS --brand $BRAND"; fi
          if [ "$ALL_PRODUCTS" = "true" ]; then ARGS="$ARGS --all-products"; fi
          if [ "$KEPT_ONLY" = "true" ]; then ARGS="$ARGS --kept-only"; fi
          for s in $SKUS; do ARGS="$ARGS --sku $s"; done
          if [ "$ONLY_NEW" = "true" ]; then ARGS="$ARGS --only-new"; fi
          python -m rtech_sync.run $ARGS
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run summary (counts only)
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          [ -f pd/data/summary.md ] && cat pd/data/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit data files to the private data repo
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          cd pd
          git config user.name "price-sync-bot"
          git config user.email "price-sync-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -q -m "price sync $(TZ=Asia/Kolkata date +%F) [$MODE]"
            for i in 1 2 3 4; do
              git pull -q --rebase --autostash && git push -q && break
              echo "push attempt $i failed, retrying"; sleep $((i * 10))
              if [ "$i" = 4 ]; then echo "::error::could not push state; latest.json is NOT saved"; exit 1; fi
            done
          fi

      - name: Open flags issue in the private data repo
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -f pd/data/flags_issue.md ]; then
            R=VRH7733/rtech-price-data
            gh label create price-flag -R $R --color D93F0B --force || true
            # keep one open flags issue: close the older ones (they stay readable)
            for n in $(gh issue list -R $R --label price-flag --state open --json number --jq '.[].number' || true); do
              gh issue close "$n" -R $R --comment "Superseded by the newer flags issue." || true
            done
            gh issue create -R $R --title "Price flags $(TZ=Asia/Kolkata date +%F) [$MODE]" \
              --label price-flag --body-file pd/data/flags_issue.md \
              || echo "::warning::could not open the flags issue (token needs Issues: write); flags are in data/flags.csv"
          fi

      - name: Fail the job if the sync hit a fatal problem
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          code="${{ steps.sync.outputs.exit_code }}"
          if [ -n "$code" ] && [ "$code" != "0" ]; then echo "sync exit code $code"; exit 1; fi
