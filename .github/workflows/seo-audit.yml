name: seo-audit

# Manual, read-only: what search engines and AI assistants can read on the shop (home page,
# robots.txt, llms.txt, sitemaps, structured data on a few product pages). About 20 public
# pages, 2 s apart. The log shows status lines only; the report goes to the PRIVATE data repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: VRH7733/rtech-price-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: pd

      - name: Audit the shop
        env:
          WC_URL: ${{ secrets.WC_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python3 tools/seo_audit.py pd/seo/audit.md

      - name: Save the report to the private data repo
        if: always()
        run: |
          cd pd
          git config user.name "price-sync-bot"
          git config user.email "price-sync-bot@users.noreply.github.com"
          git add seo/audit.md 2>/dev/null || exit 0
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "seo audit $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
