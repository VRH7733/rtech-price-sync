name: create-drafts

# Manual only. Creates shop products for the catalogue SKUs you name and writes their product ids
# back to the PRIVATE data repo. live=false: DRAFT (invisible). live=true: published as in-stock
# "Request a Quote" products; the daily run then gives them the cheapest price.
# apply=false (the default) only prints the plan. Nothing existing in the shop is changed.
on:
  workflow_dispatch:
    inputs:
      catalogue:
        description: "catalogue file(s) in the data repo, space-separated, e.g. catalogue/rows/polycab.csv"
        required: true
      skus:
        description: "SKUs separated by spaces, e.g. RT-POLY-001 RT-POLY-002"
        required: true
      apply:
        description: "really create the products (false = plan only)"
        type: boolean
        default: false
      live:
        description: "publish as in-stock Request a Quote products (owner approved 15 Oct 2026)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shop-writes
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # ~5 s per product: a 600-product brand takes ~50 min
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: VRH7733/rtech-price-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: pd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Create drafts
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          CATALOGUE: ${{ github.event.inputs.catalogue }}
          SKUS: ${{ github.event.inputs.skus }}
          APPLY: ${{ github.event.inputs.apply }}
          LIVE: ${{ github.event.inputs.live }}
        run: |
          ARGS=""
          for s in $SKUS; do ARGS="$ARGS --sku $s"; done
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --live"; fi
          rc=0
          for f in $CATALOGUE; do  # several files allowed; each only touches its own SKUs
            case "$f" in catalogue/rows/*.csv) ;; *) echo "::error::catalogue must be catalogue/rows/<file>.csv"; exit 1;; esac
            echo "== $f"
            python tools/create_drafts.py "pd/$f" $ARGS > out.txt || rc=1
            grep -v ": not_in_catalogue$" out.txt || true
          done
          exit $rc

      - name: Save product ids to the private data repo
        if: github.event.inputs.apply == 'true'
        env:
          SKUS: ${{ github.event.inputs.skus }}
        run: |
          cd pd
          git config user.name "price-sync-bot"
          git config user.email "price-sync-bot@users.noreply.github.com"
          git add catalogue
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -q -m "products created: $SKUS"
            git pull -q --rebase && git push -q
          fi
