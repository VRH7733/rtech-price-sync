name: create-drafts

# Manual only. Creates DRAFT shop products (no price, out of stock, invisible to shoppers) for the
# catalogue SKUs you name, and writes their product ids back to the PRIVATE data repo.
# apply=false (the default) only prints the plan. Nothing existing in the shop is changed.
on:
  workflow_dispatch:
    inputs:
      catalogue:
        description: "catalogue file in the data repo, e.g. catalogue/rows/polycab.csv"
        required: true
      skus:
        description: "SKUs separated by spaces, e.g. RT-POLY-001 RT-POLY-002"
        required: true
      apply:
        description: "really create the drafts (false = plan only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shop-writes
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: VRH7733/rtech-price-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: pd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Create drafts
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          CATALOGUE: ${{ github.event.inputs.catalogue }}
          SKUS: ${{ github.event.inputs.skus }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          case "$CATALOGUE" in catalogue/rows/*.csv) ;; *) echo "::error::catalogue must be catalogue/rows/<file>.csv"; exit 1;; esac
          ARGS=""
          for s in $SKUS; do ARGS="$ARGS --sku $s"; done
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          python tools/create_drafts.py "pd/$CATALOGUE" $ARGS

      - name: Save product ids to the private data repo
        if: github.event.inputs.apply == 'true'
        run: |
          cd pd
          git config user.name "price-sync-bot"
          git config user.email "price-sync-bot@users.noreply.github.com"
          git add catalogue
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -q -m "drafts created: ${{ github.event.inputs.skus }}"
            git pull -q --rebase && git push -q
          fi
