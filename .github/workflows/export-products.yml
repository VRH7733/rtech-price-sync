name: export-products

# Manual, read-only backup of all WooCommerce products and variations.
# Writes the JSON to the PRIVATE data repo. The public log shows counts only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: VRH7733/rtech-price-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Export products and variations
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python3 tools/export_products.py data/backup

      - name: Commit backup to the private data repo
        run: |
          cd data
          git config user.name "price-sync-bot"
          git config user.email "price-sync-bot@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Product backup $(date -u +%F)"
            git push
          fi
