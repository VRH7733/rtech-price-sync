name: wp-plugin-test

# Installs WordPress + WooCommerce + Rank Math on the runner (nothing touches the real shop),
# activates wordpress/rtech-ai-seo, builds two products shaped like the live ones and checks
# the pages: structured data, titles, descriptions, /llms.txt and the PHP error log.
# The plugin zip to install on the shop is attached to the run.
on:
  workflow_dispatch:
  push:
    paths: ["wordpress/**", ".github/workflows/wp-plugin-test.yml"]

permissions:
  contents: read

jobs:
  test:
    # rankmath-schema: Rank Math prints the Product (its defaults).
    # woocommerce-schema: Rank Math's schema modules off, WooCommerce prints it (as on the live shop).
    strategy:
      fail-fast: false
      matrix:
        schema: [rankmath-schema, woocommerce-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Install WordPress, WooCommerce and Rank Math
        run: |
          curl -sSLo /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp
          mkdir site && cd site
          wp core download --quiet
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          wp core install --url=http://127.0.0.1:8080 --title=rtechelectricals --admin_user=admin --admin_password=admin --admin_email=test@example.com --skip-email --quiet
          wp rewrite structure '/%postname%/' --quiet
          wp plugin install woocommerce seo-by-rank-math --activate --quiet
          # Rank Math prints nothing on the front end until its setup wizard has run once
          wp option update rank_math_wizard_completed 1
          wp option update rank_math_registration_skip 1
          if [ "${{ matrix.schema }}" = "woocommerce-schema" ]; then
            wp eval '$m = array_values( array_diff( (array) get_option( "rank_math_modules" ), array( "rich-snippet", "woocommerce" ) ) ); update_option( "rank_math_modules", $m ); echo implode( ",", $m ), "\n";'
          fi
          wp plugin list --fields=name,version,status
          mkdir -p wp-content/mu-plugins
          cp ../wordpress/tests/strip_quote_schema.php ../wordpress/tests/mail_log.php wp-content/mu-plugins/
          cp -r ../wordpress/rtech-ai-seo wp-content/plugins/
          wp plugin activate rtech-ai-seo
          wp eval-file ../wordpress/tests/setup_site.php
          wp option update woocommerce_coming_soon no
          wp wc tool run install_pages --user=admin || true
          wp rewrite flush --quiet
          cp ../wordpress/tests/router.php .
          wp eval-file ../wordpress/tests/live_returns_pages.php
          wp eval 'echo get_option("rtech_ai_version"), "\n";'   # this load runs the update steps
          for slug in refund_returns returns-and-refunds; do
            st=$(wp post list --post_type=page --post_status=any,trash --name="${slug}__trashed" --field=post_status; wp post list --post_type=page --post_status=any --name="$slug" --field=post_status)
            echo "$slug: $st"
            case "$st" in *publish*|*draft*) echo "::error::$slug was not moved to Trash ($st)"; exit 1 ;; esac
          done
          body=$(wp post list --post_type=page --post_status=publish --name=return-cancellation-policy --field=post_content)
          echo "$body" | grep -q "Proprietor, RAMTECH AUTOMATION" && echo "$body" | grep -q "within 7 business days" || { echo "::error::own returns page not filled with the new terms"; exit 1; }
          wp option get rtech_ai_returns_backup --format=json | grep -q "Old policy text from September" || { echo "::error::old returns text not kept"; exit 1; }
          # 1.1.0: order requests through WooCommerce's Cash on delivery method, phone required
          cod=$(wp option get woocommerce_cod_settings --format=json); echo "cod: $cod"
          echo "$cod" | grep -q '"enabled":"yes"' && echo "$cod" | grep -q 'Order request' && echo "$cod" | grep -q '"enable_for_virtual":"yes"' || { echo "::error::order requests not switched on ($cod)"; exit 1; }
          [ "$(wp option get woocommerce_checkout_phone_field)" = required ] || { echo "::error::phone not required at checkout"; exit 1; }
          body=$(wp post list --post_type=page --post_status=publish --name=delivery-and-pickup --field=post_content)
          echo "$body" | grep -q "We book transport for you" && ! echo "$body" | grep -q "We do not deliver" || { echo "::error::published delivery page not updated"; exit 1; }
          body=$(wp post list --post_type=page --post_status=publish --name=return-cancellation-policy --field=post_content)
          echo "$body" | grep -q "ask us to book Porter or a courier" || { echo "::error::returns page delivery section not updated"; exit 1; }

      - name: Check the pages
        run: |
          cd site
          php -S 127.0.0.1:8080 router.php > /tmp/server.log 2>&1 &
          sleep 3
          touch wp-content/debug.log
          body=$(wp post list --post_type=page --post_status=draft --name=custom-panel-boards-cable-trays --field=post_content)
          echo "services draft: $(echo "$body" | head -c 400)"
          echo "$body" | grep -q "custom electrical panel boards and cable trays" || { echo "::error::draft services page missing"; exit 1; }
          # published, as the owner would: the shop-wide line, business data and llms.txt then mention it
          wp post update $(wp post list --post_type=page --post_status=draft --name=custom-panel-boards-cable-trays --field=ID) --post_status=publish
          wp transient delete rtech_ai_llms_txt
          python3 ../wordpress/tests/check_pages.py http://127.0.0.1:8080 wp-content/debug.log wp-content/mail.log
          n=$(wp post list --post_type=page --post_status=draft --name=brands-we-supply --format=count)
          echo "draft brands pages: $n"
          if [ "$n" != "1" ]; then echo "::error::draft Brands We Supply page: expected 1, got $n"; exit 1; fi
          wp post list --post_type=page --post_status=draft --name=brands-we-supply --field=post_content | head -c 1500
          for slug in delivery-and-pickup; do
            body=$(wp post list --post_type=page --post_status=publish --name=$slug --field=post_content)
            echo "$slug: $(echo "$body" | head -c 300)"
            case "$slug" in
              delivery-and-pickup) want="send your own transport" ;;
              returns-and-refunds) want="Proprietor, RAMTECH AUTOMATION" ;;
            esac
            echo "$body" | grep -qi "$want" || { echo "::error::draft $slug missing or without '$want'"; exit 1; }
            echo "$body" | grep -q "560065" || { echo "::error::draft $slug without the address"; exit 1; }
          done

      - name: Show the product page head
        if: always()
        run: curl -s http://127.0.0.1:8080/product/priced-cable/ | sed -n '/<head/,/<\/head>/p' | grep -iE 'rank|<title|description|og:' | head -40 || true

      - name: Show the PHP log
        if: always()
        run: tail -50 site/wp-content/debug.log || true

      - name: Build the plugin zip
        if: matrix.schema == 'woocommerce-schema'
        run: cd wordpress && zip -qr ../rtech-ai-seo.zip rtech-ai-seo

      - uses: actions/upload-artifact@v4
        if: matrix.schema == 'woocommerce-schema'
        with:
          name: rtech-ai-seo
          path: rtech-ai-seo.zip
