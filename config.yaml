# rtech-price-sync configuration. Contact email comes from env RTECH_CONTACT_EMAIL.
site:
  base_url: "https://rtechelectricals.com"
  timezone: "Asia/Kolkata"

sources:
  moglix:
    domain: "moglix.com"
    # Verified 14 Oct 2026 on 6 real pages: "(Incl. of all taxes)", JSON-LD price = incl figure
    # (tests/test_real_moglix.py); bot fetch 15 Oct gave the same pages
    assumed_tax_basis: incl_gst
  industrybuying:
    domain: "industrybuying.com"
    # Verified 14 Oct 2026 on 6 real pages: "(Incl. of all taxes)", JSON-LD price = incl figure
    # (tests/test_real_industrybuying.py); bot fetch 15 Oct gave the same prices
    assumed_tax_basis: incl_gst
  homerun:
    domain: "home-run.co"
    # Owner's delivery pincode (decided 15 Oct 2026): 560065. The bot sends no pincode; the
    # server-rendered price was the same as the owner's browser on 14/14 pages (15 Oct bot check).
    # Verified 14 Oct 2026 on 8 real pages: price block says "Incl GST" (tests/test_real_homerun.py)
    assumed_tax_basis: incl_gst

pricing:
  # Owner's go-live approval (15 Oct 2026, in the project thread): publish the CHEAPEST price of
  # HomeRun, Moglix and IndustryBuying every day, single-site prices included. Guards: a listing
  # more than outlier_ratio x away from the others is ignored; a move > big_move_pct is held one
  # day and published when it repeats. "spread" = the earlier 5% agreement rule.
  rule: cheapest
  spread_flag_pct: 5               # spread rule only: spread >= this => flag and hold
  big_move_pct: 40                 # cheapest rule: a move > this is held one day (was 15, spread rule)
  big_move_holds: false            # true => also hold the price when big_move fires
  single_source_max_move_pct: 5    # with one source, publish only if within this of last price
  # Owner's STOP 2 decision (15 Oct 2026): a site priced more than 2x the cheapest OTHER site is a
  # listing error (IndustryBuying lists some wires twice, one at 3-5x). It is ignored and flagged;
  # the 5% rule then applies to the remaining sites. The cheapest site is never ignored.
  outlier_ratio: 2
  # Same 2x guard across a wire's colours/lines (15 Oct 2026 Polycab run: ~60 IndustryBuying-only
  # wire prices were 2-5x the same size elsewhere). Such a price shows Request a Quote, flagged.
  sibling_ratio: 2
  # IndustryBuying "-ELE." listings are third-party seller listings: all 33 that another site also
  # had were 2-9x dearer (median 4.6x, 15 Oct 2026; e.g. 100 Legrand cable ties Rs 18,879). Alone,
  # such a listing gives Request a Quote, not a price.
  needs_second_site:
    industrybuying: "-ELE."
  # Owner, 18 Oct 2026: "get the cheapest of moglix and homerun, for that add one % dis":
  # published price = cheapest x 0.99, rounded up to the rupee.
  default_markup_pct: -1
  default_gst_pct: 18
  stale_days: 6                    # no validated price for this many days => hide price (two
                                   # missed 3-day checks in a row; one miss keeps the price)
  # 18 Oct 2026 (IndustryBuying refuses us since 16 Oct; recommended to the owner): while a site refuses us, its LAST
  # real price for a product stays in the comparison for up to this many days (it is never
  # re-read from anywhere else). The cheapest rule and all guards still apply.
  keep_blocked_days: 30
  fetch_for_manual_rows: true      # STOP 2: manual_price rows are fetched so you are told when a
                                   # marketplace goes below your price (market_below_manual)

fetch:
  # Owner, 16 Oct 2026: "we dont want to get banned ... at max make the update checker once in
  # three days ... part of checking everyday". Each product is checked once every 3 days (a
  # third of the catalogue each morning, chosen by SKU), slowly, with a hard cap per site.
  check_every_days: 3
  # Owner, 18 Oct 2026: "lets use moglix and homerun only, we dont waste time on industry buy".
  # IndustryBuying is not asked at all; its last real prices stay for keep_blocked_days.
  skip_sources: [industrybuying]
  min_delay_seconds: 6             # per host, across everything in the process
  timeout_seconds: 25
  retries: 1                       # one backoff retry on 429/5xx
  retry_wait_seconds: 20
  # Fetching stops after this many minutes so there is time left to publish and commit inside the
  # 6 h (360 min) GitHub job cap and before the shop's 07:30 IST cache purge (run starts 01:00 IST).
  max_runtime_minutes: 300
  per_host_request_budget:         # most requests one run may send to a site
    moglix: 1500
    industrybuying: 1500
    homerun: 1500

publisher:
  batch_size: 25
  # No price from any site => in stock, no price, "Request a Quote" button to the shop's own quote
  # form (the same page the P6 Sprint buttons use). Owner's go-live approval, 15 Oct 2026.
  quote_external: true
  quote_button_text: "Request a Quote"
  quote_url: "https://rtechelectricals.com/request-best-price/?rte_product_sku={sku}&rte_cta=quote"
  pause_seconds: 2
  backoff_seconds: [5, 15, 45, 120]
  backoff_statuses: [429, 502, 503, 504, 508]
  stop_after_consecutive_failures: 3
  history_keep_days: 30
  set_instock: true                # priced items are set to "in stock" (removes the SOLD OUT badge)
  clear_sale_price: true           # an old sale price would override the synced regular price
